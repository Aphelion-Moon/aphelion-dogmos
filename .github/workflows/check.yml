name: Check Dogmos
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
          - os: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The documentation gate verifies its reviewed revision is an ancestor.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes g++-multilib libclang-dev
      - run: cargo +1.98.0 fmt --all -- --check
      - run: python -B -m unittest discover -s tools/tests -v
      - run: python -B tools/check_agent_docs.py
      - run: python -B tools/check_dependency_direction.py --target ${{ matrix.target }}
      - run: cargo +1.98.0 clippy --workspace --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo +1.98.0 test --workspace --locked --target ${{ matrix.target }}
      - name: Check supported features
        run: python -B tools/check_feature_matrix.py --target ${{ matrix.target }}
  artifacts:
    uses: ./.github/workflows/build.yml
