name: Build in-process Dogmos artifacts
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
          - os: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes g++-multilib libclang-dev binutils
      - name: Build source-bound native bundle
        shell: pwsh
        run: tools/build_in_process.ps1 -TargetTriple '${{ matrix.target }}' -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'target/native-bundle')
      - uses: actions/upload-artifact@v7
        with:
          name: dogmos-${{ matrix.target }}
          path: target/native-bundle
          if-no-files-found: error
