# Run the dependency policy on the supported in-process default + telemetry graph.
# The alternative reaction backends are mutually exclusive at compile time.
[graph]
targets = ["i686-pc-windows-msvc", "i686-unknown-linux-gnu"]
all-features = false
features = ["tracy"]

[advisories]
unmaintained = "workspace"
unsound = "all"

[bans]
wildcards = "deny"
multiple-versions = "warn"

[bans.workspace-dependencies]
# Existing root and callback tracing declarations resolve to one version.
duplicates = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "branch"
# crates.io is the only registry; the git source is required for BYOND 516 ABI support.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/spacestation13/byondapi-rs"]
